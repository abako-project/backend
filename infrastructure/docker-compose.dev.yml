services:
  mongodb:
    image: mongo:7.0
    container_name: abako-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
      - MONGO_INITDB_DATABASE=abako
    volumes:
      - mongodb-data:/data/db
    networks:
      - abako-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  zombienet:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    container_name: kreivo-zombienet
    ports:
      - "21000:21000"
    networks:
      - abako-network
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Content-Type: application/json", "-d", '{"id":1, "jsonrpc":"2.0", "method": "system_health"}', "http://localhost:21000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  contracts-api:
    build:
      context: ..
      dockerfile: packages/contracts-api/Dockerfile
    container_name: contracts-api-service
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - NODE_ENV=development
      - KREIVO_PROVIDER=ws://zombienet:21000
      - PHRASE=
      - DERIVE_PATH=//Alice
      - PROJECTS_APP_ID=0
      - CALENDAR_APP_ID=1
      - RATINGS_APP_ID=2
    networks:
      - abako-network
    depends_on:
      zombienet:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ../packages/contracts-api/src
          target: /app/src
        - action: rebuild
          path: ../packages/contracts-api/package.json

  adapter-api:
    build:
      context: ..
      dockerfile: packages/adapter-api/Dockerfile
    container_name: adapter-api-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=development
      - SIGNING_SERVICE_URL=http://contracts-api:3010
      - FEDERATE_SERVER=http://virto-api:3000/api
      - PROVIDER_URL=ws://zombienet:21000
      - PHRASE=
      - DERIVE_PATH=//Alice
      - JWT_SECRET=virto-server-example-secret-key-change-in-production
      - JWT_EXPIRES_IN=3600
      - NODE_NO_WARNINGS=1
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/abako?authSource=admin
      - DEFAULT_RATINGS_CONTRACT=JEnwSomCEqPrh5HcEzPFNKVfrfoFjVLR6JVJvqKaTfba4zY
      - DEFAULT_CALENDAR_CONTRACT=Dd34LSU53MLwJpq4wfHmDFwAifJrcaPbd1qTCGZcR7iXQkd
      - BRAMP_SERVICE_URL=http://bramp:3001
    networks:
      - abako-network
    depends_on:
      mongodb:
        condition: service_healthy
      zombienet:
        condition: service_healthy
      contracts-api:
        condition: service_started
      virto-api:
        condition: service_started
      bramp:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ../packages/adapter-api/src
          target: /app/src
        - action: rebuild
          path: ../packages/adapter-api/package.json

  bramp:
    build:
      context: ../packages/bramp
      dockerfile: Dockerfile
    container_name: bramp-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - DATABASE_URL=file:/app/data/bramp.db
      - PROVIDER_URL=ws://zombienet:21000
      - MASTER_ACCOUNT_URI=//Alice
    volumes:
      - bramp-data:/app/data
    networks:
      - abako-network
    depends_on:
      zombienet:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ../packages/bramp/src
          target: /app/src
        - action: rebuild
          path: ../packages/bramp/package.json

  virto-api:
    build:
      context: ..
      dockerfile: packages/virto-api/Dockerfile
    container_name: virto-api-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - KREIVO_PROVIDER=ws://zombienet:21000
      - PHRASE=
      - DERIVE_PATH=//Alice
      - COMMUNITY_ID=1
      - VOS_DATA_PATH=/app/data
      - NODE_NO_WARNINGS=1
    volumes:
      - virto-api-data:/app/data
    networks:
      - abako-network
    depends_on:
      zombienet:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    develop:
      watch:
        - action: sync
          path: ../packages/virto-api/src
          target: /app/src
        - action: rebuild
          path: ../packages/virto-api/package.json

volumes:
  mongodb-data:
    driver: local
  virto-api-data:
    driver: local
  bramp-data:
    driver: local

networks:
  abako-network:
    driver: bridge

